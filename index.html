<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fakturace KOOLEKTIV</title>
<meta name="theme-color" content="#e6e6e6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fakturace">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff4000'/%3E%3Ctext x='32' y='45' font-family='Arial,sans-serif' font-size='38' font-weight='700' text-anchor='middle' fill='%23000'%3EK%3C/text%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #e6e6e6; }
  iframe { display: block; border: 0; width: 100%; height: 100vh; height: 100dvh; }
  noscript p { font: 16px/1.5 system-ui, sans-serif; padding: 24px; }
</style>
</head>
<body>
<noscript><p>Fakturace potřebuje zapnutý JavaScript.</p></noscript>
<script>
/*
 * Obalová stránka pro web appku Fakturace KOOLEKTIV (Google Apps Script).
 *
 * Proč existuje: když je v prohlížeči přihlášeno víc Google účtů, Google přímou adresu appky
 * přesměruje na /u/N/ a ukáže „soubor momentálně nelze otevřít“. Tady se appka vloží do rámu
 * bez Google cookies (atribut credentialless), takže se načte jako pro anonymního návštěvníka.
 *
 * Takový rám si nic dlouhodobě nepamatuje, proto přihlášení do appky (token, platí 30 dní)
 * drží tahle stránka ve svém localStorage a appce ho předává zprávou postMessage.
 * Zprávy se přijímají jen z rámu appky (origin *-script.googleusercontent.com).
 */
(function () {
  'use strict';
  var APP = 'https://script.google.com/macros/s/AKfycbxKH64zoBmMbEXvdVy7f0aHZFS4dzHcksPa5pCKgs6VwtWtaQHA4Y8TiI4hKii8S2RG/exec';
  var KLIC = 'kf_token';
  var APP_ORIGIN = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;

  function nacist() { try { return localStorage.getItem(KLIC) || ''; } catch (e) { return ''; } }
  function ulozit(t) {
    try { if (t) localStorage.setItem(KLIC, t); else localStorage.removeItem(KLIC); } catch (e) { /* nic */ }
  }

  window.addEventListener('message', function (e) {
    if (!APP_ORIGIN.test(e.origin) || !e.data || typeof e.data !== 'object') return;
    if (e.data.typ === 'kf-token-get') {
      if (e.source) e.source.postMessage({ typ: 'kf-token', token: nacist() }, e.origin);
    } else if (e.data.typ === 'kf-token') {
      ulozit(String(e.data.token || ''));
    }
  });

  var f = document.createElement('iframe');
  f.setAttribute('credentialless', '');
  f.credentialless = true;
  f.title = 'Fakturace KOOLEKTIV';
  f.allow = 'clipboard-write';
  f.src = APP + location.hash;
  document.body.appendChild(f);
})();
</script>
</body>
</html>
